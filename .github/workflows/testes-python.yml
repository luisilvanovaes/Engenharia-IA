name: Testes Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Executar todos os testes
        working-directory: 01-Fundamentos-Python-ML
        run: |
          python -m pytest testes -v

      - name: Verificar cobertura SHA-256
        working-directory: 01-Fundamentos-Python-ML
        run: |
          python -m pytest testes/test_integridade_qualidade.py -v --cov=exercicios.integridade_qualidade --cov-branch --cov-report=term-missing --cov-fail-under=100